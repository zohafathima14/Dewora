<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Discover Dewora skincare essentials — gentle sunscreens, restorative moisturizers, balancing cleansers, and targeted serums for healthy everyday glow.">
  <title>Shop All Skincare — Dewora</title>

  <!-- Google Fonts Preconnect & Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Core Scripts (Predictable Load Order with Defer) -->
  <script src="js/data/products.js" defer></script>
  <script src="js/utils/currency.js" defer></script>
  <script src="js/utils/dom.js" defer></script>
  <script src="js/utils/storage.js" defer></script>
  <script src="js/components/header.js" defer></script>
  <script src="js/components/footer.js" defer></script>
  <script src="js/components/product-card.js" defer></script>
  <script src="js/components/toast.js" defer></script>
  <script src="js/components/accordion.js" defer></script>
  <script src="js/components/mobile-menu.js" defer></script>
  <script src="js/pages/shop.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="shop">
  <!-- Accessibility Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Mount Point for Shared Header -->
  <div id="site-header"></div>

  <!-- Primary Main Content Landmark -->
  <main id="main-content" class="section-spacing" style="padding-top: 2rem;">
    <div class="container">
      
      <!-- Breadcrumb Navigation -->
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="breadcrumb-separator" aria-hidden="true">/</span>
        <a href="shop.html">Shop</a>
        <span class="breadcrumb-separator" aria-hidden="true">/</span>
        <span class="breadcrumb-current" id="breadcrumb-category">All Skincare</span>
      </nav>

      <!-- Shop Page Header -->
      <header class="shop-header">
        <h1 class="shop-header-title">Shop all skincare</h1>
        <p class="shop-header-desc">Mindful, barrier-loving skincare essentials formulated for real skin and healthy everyday glow. Filter by category, skin type, or concern.</p>
      </header>

      <!-- Main Catalog Layout Grid -->
      <div class="shop-layout">
        
        <!-- Desktop Filter Sidebar -->
        <aside class="shop-sidebar" aria-label="Product Filters">
          <div class="sidebar-header">
            <span class="sidebar-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
              Filters
            </span>
            <button type="button" class="sidebar-clear-btn" id="sidebar-clear-all-btn">Reset</button>
          </div>
          <div id="shop-sidebar-filters">
            <!-- Populated dynamically by shop.js -->
          </div>
        </aside>

        <!-- Catalog Main Area -->
        <section class="shop-main" aria-label="Products Catalogue">
          
          <!-- Shop Toolbar -->
          <div class="shop-toolbar">
            <div class="shop-count" id="shop-product-count" role="status" aria-live="polite">
              Showing <strong>12</strong> essentials
            </div>

            <div class="shop-toolbar-actions">
              <!-- Mobile Filter Trigger Button -->
              <button type="button" class="mobile-filter-trigger" id="mobile-filter-trigger" aria-expanded="false" aria-controls="mobile-filter-drawer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                <span>Filters</span>
                <span class="mobile-filter-badge" id="mobile-filter-badge" style="display: none;">0</span>
              </button>

              <!-- Sort Dropdown -->
              <div class="shop-sort-wrap">
                <label for="shop-sort-select" class="shop-sort-label">Sort by:</label>
                <select id="shop-sort-select" class="shop-sort-select" aria-label="Sort products by">
                  <option value="featured">Featured</option>
                  <option value="price-low">Price: Low to High</option>
                  <option value="price-high">Price: High to Low</option>
                  <option value="rating-high">Rating: High to Low</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Active Filter Chips Bar -->
          <div class="active-filters-bar" id="active-filters-container" style="display: none;" aria-label="Active filter tags">
            <!-- Populated dynamically by shop.js -->
          </div>

          <!-- Products Grid -->
          <div class="product-grid" id="shop-product-grid">
            <!-- Populated dynamically by shop.js -->
          </div>

        </section>

      </div>
    </div>
  </main>

  <!-- Mobile Filter Drawer Modal -->
  <div class="mobile-filter-drawer-backdrop" id="mobile-filter-drawer-backdrop" aria-hidden="true"></div>
  <aside class="mobile-filter-drawer" id="mobile-filter-drawer" role="dialog" aria-modal="true" aria-label="Filter Products" aria-hidden="true">
    <div class="mobile-filter-drawer-header">
      <h2 style="font-family: var(--font-body); font-size: 1.15rem; font-weight: 600; color: var(--color-ink);">Filter Products</h2>
      <button type="button" class="icon-btn" id="mobile-filter-drawer-close" aria-label="Close filters drawer">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div class="mobile-filter-drawer-body" id="mobile-filter-drawer-filters">
      <!-- Populated dynamically by shop.js -->
    </div>
    <div class="mobile-filter-drawer-footer">
      <button type="button" class="btn btn-outline" id="mobile-filter-clear-btn">Clear All</button>
      <button type="button" class="btn btn-primary" id="mobile-filter-apply-btn">Apply Filters</button>
    </div>
  </aside>

  <!-- Mount Point for Shared Footer -->
  <div id="site-footer"></div>
</body>
</html>
