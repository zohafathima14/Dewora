<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F3" />
      <stop offset="100%" stop-color="#F6E4DE" />
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F7FAF6" />
      <stop offset="100%" stop-color="#E5ECE4" />
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#526B54" />
      <stop offset="100%" stop-color="#415643" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />
  
  <!-- Subtle shadow -->
  <ellipse cx="200" cy="410" rx="65" ry="12" fill="#252923" opacity="0.08" />

  <!-- Bottle Body -->
  <rect x="145" y="190" width="110" height="200" rx="16" fill="url(#bottle)" stroke="#E9E3DC" stroke-width="1.5" />
  
  <!-- Cap / Dropper -->
  <rect x="180" y="145" width="40" height="45" rx="4" fill="url(#cap)" />
  <rect x="188" y="125" width="24" height="20" rx="3" fill="#DCE8D8" />
  
  <!-- Bottle Label -->
  <rect x="155" y="235" width="90" height="110" rx="4" fill="#FFFFFF" opacity="0.9" stroke="#E9E3DC" stroke-width="0.5" />
  <text x="200" y="270" font-family="'DM Serif Display', Georgia, serif" font-size="16" fill="#252923" text-anchor="middle">Dewora</text>
  <line x1="175" y1="285" x2="225" y2="285" stroke="#DCE8D8" stroke-width="1" />
  <text x="200" y="305" font-family="'DM Sans', sans-serif" font-size="9" font-weight="600" fill="#526B54" letter-spacing="1" text-anchor="middle">DAILY CARE</text>
  <text x="200" y="325" font-family="'DM Sans', sans-serif" font-size="8" fill="#74776F" text-anchor="middle">Everyday Skincare</text>
</svg>
