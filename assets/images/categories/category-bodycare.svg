    <text x="30" y="95" font-family="'DM Serif Display', serif" font-size="8" fill="#252923" text-anchor="middle">Dewora</text>
    <text x="30" y="112" font-family="'DM Sans', sans-serif" font-size="5" font-weight="700" fill="#526B54" text-anchor="middle">VELVET BODY</text>
    <text x="30" y="124" font-family="'DM Sans', sans-serif" font-size="5" fill="#74776F" text-anchor="middle">Hydrating Lotion</text>
