      <stop offset="0%" stop-color="#FFF9F3" />
      <stop offset="100%" stop-color="#DCE8D8" />
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="16" fill="url(#bgBody)" />
  <circle cx="160" cy="160" r="100" fill="#FFFFFF" opacity="0.6" />

  <!-- Botanical Leaves -->
  <path d="M190,130 C215,110 230,125 240,150 C220,150 200,145 190,130 Z" fill="#526B54" opacity="0.15" />
  <path d="M110,180 C85,200 70,185 60,160 C80,160 100,165 110,180 Z" fill="#526B54" opacity="0.15" />

