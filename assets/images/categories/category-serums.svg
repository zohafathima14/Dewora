    <text x="30" y="108" font-family="'DM Serif Display', serif" font-size="7" fill="#252923" text-anchor="middle">Dewora</text>
    <text x="30" y="122" font-family="'DM Sans', sans-serif" font-size="5" font-weight="700" fill="#526B54" text-anchor="middle">GLOW</text>
